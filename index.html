<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Anonymous Stranger Chat</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #121212; color: #fff; display: flex; flex-direction: column; height: 100vh; }
    header { padding: 12px 16px; background: #1f1f1f; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
    #status { font-size: 13px; color: #aaa; margin-top: 2px; }
    #video-container { display: none; height: 35vh; background: #000; position: relative; }
    video { width: 100%; height: 100%; object-fit: cover; }
    #localVideo { width: 90px; height: 120px; position: absolute; right: 10px; bottom: 10px; border: 2px solid #007aff; border-radius: 8px; z-index: 10; }
    #chat-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .msg { padding: 9px 13px; border-radius: 12px; max-width: 80%; font-size: 14px; word-break: break-word; }
    .me { background: #007aff; align-self: flex-end; }
    .stranger { background: #2c2c2e; align-self: flex-start; }
    .system { background: transparent; color: #888; align-self: center; font-size: 12px; text-align: center; }
    
    /* Photo protection */
    .msg img { 
      max-width: 100%; 
      border-radius: 6px; 
      margin-top: 5px;
      -webkit-touch-callout: none !important;
      -webkit-user-select: none !important;
      user-select: none !important;
      pointer-events: none;
    }

    /* Voice Note player styling */
    .msg audio {
      max-width: 210px;
      height: 38px;
      margin-top: 4px;
    }

    #controls { 
      padding: 10px; 
      background: #1f1f1f; 
      display: flex; 
      gap: 8px; 
      align-items: center; 
      position: relative;
      z-index: 99999;
      margin-bottom: 15px;
    }
    #msgInput { flex: 1; padding: 10px 14px; border-radius: 20px; border: 1px solid #333; background: #2c2c2e; color: #fff; outline: none; }
    button { padding: 8px 12px; border: none; border-radius: 20px; background: #007aff; color: #fff; font-weight: bold; cursor: pointer; font-size: 13px; }
    button.secondary { background: #3a3a3c; }
    .btn-icon { background: transparent; font-size: 20px; padding: 4px; border-radius: 50%; }
    .recording { background: #ff3b30 !important; color: #fff; animation: pulse 1s infinite alternate; }
    
    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.15); }
    }

    #fileInput { display: none; }

    [data-netlify-deploy-id], .netlify-badge, iframe[id*="netlify"] {
      display: none !important;
    }
  </style>
</head>
<body>

  <header>
    <div>
      <strong>Stranger Chat</strong>
      <div id="status">Connecting...</div>
    </div>
    <div style="display:flex; gap:5px;">
      <button id="findBtn" onclick="findStranger()">🔍 Match</button>
      <button class="secondary" onclick="requestMediaCall('audio')">📞 Audio</button>
      <button id="videoBtn" class="secondary" onclick="requestMediaCall('video')">📹 Video</button>
      <button class="secondary" onclick="nextStranger()">Next</button>
    </div>
  </header>

  <div id="video-container">
    <video id="remoteVideo" autoplay playsinline></video>
    <video id="localVideo" autoplay playsinline muted></video>
  </div>

  <div id="chat-box"></div>

  <div id="controls">
    <label for="fileInput" class="btn-icon" style="cursor:pointer;">📷</label>
    <input type="file" id="fileInput" accept="image/*" onchange="sendPhoto(this)">
    
    <button id="micBtn" class="btn-icon" onclick="toggleVoiceRecording()" title="Voice note">🎙️</button>
    
    <input type="text" id="msgInput" placeholder="Message likhein..." onkeypress="handleKey(event)">
    <button onclick="sendText()">Send</button>
  </div>

  <script>
    const DB_URL = "https://stranger-match-a4ab3-default-rtdb.firebaseio.com";
    let peer = new Peer();
    let myId = "";
    let conn = null;
    let localStream = null;
    let currentCall = null;
    let isSearching = false;

    // Voice message variables
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;

    const statusEl = document.getElementById('status');
    const chatBox = document.getElementById('chat-box');
    const micBtn = document.getElementById('micBtn');

    function logMsg(text, type = 'system') {
      const d = document.createElement('div');
      d.className = `msg ${type}`;
      d.innerText = text;
      chatBox.appendChild(d);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    peer.on('open', (id) => {
      myId = id;
      statusEl.innerText = "Online. Match dabayein.";
      logMsg("Aap online hain! Stranger dhundhne ke liye 'Match' dabayein.");
    });

    peer.on('connection', (c) => {
      conn = c;
      setupChat();
      statusEl.innerText = "Connected!";
      logMsg("Stranger mil gaya! Baatein shuru karein.");
      isSearching = false;
      cleanupQueue();
    });

    async function findStranger() {
      if (!myId || isSearching) return;
      isSearching = true;
      statusEl.innerText = "Searching...";
      logMsg("Kisi stranger ki talash jari hai...");

      try {
        const res = await fetch(`${DB_URL}/waiting.json`);
        const data = await res.json();

        if (data && Object.keys(data).length > 0) {
          const keys = Object.keys(data);
          let targetPeerId = null;
          let targetKey = null;

          for (let k of keys) {
            if (data[k].peerId !== myId) {
              targetPeerId = data[k].peerId;
              targetKey = k;
              break;
            }
          }

          if (targetPeerId) {
            await fetch(`${DB_URL}/waiting/${targetKey}.json`, { method: 'DELETE' });
            conn = peer.connect(targetPeerId);
            setupChat();
            conn.on('open', () => {
              statusEl.innerText = "Connected!";
              logMsg("Stranger mil gaya! Baatein shuru karein.");
              isSearching = false;
            });
            return;
          }
        }

        const pushRes = await fetch(`${DB_URL}/waiting.json`, {
          method: 'POST',
          body: JSON.stringify({ peerId: myId, timestamp: Date.now() })
        });
        const pushData = await pushRes.json();
        window.myQueueKey = pushData.name;
        statusEl.innerText = "Waiting for match...";
      } catch (e) {
        statusEl.innerText = "Network issue.";
        isSearching = false;
      }
    }

    async function cleanupQueue() {
      if (window.myQueueKey) {
        await fetch(`${DB_URL}/waiting/${window.myQueueKey}.json`, { method: 'DELETE' }).catch(() => {});
        window.myQueueKey = null;
      }
    }

    function setupChat() {
      conn.on('data', (data) => {
        if (typeof data === 'string') {
          if (data === '__REQUEST_VIDEO__') {
            if (confirm("Stranger video call request bhej raha hai. Accept karein?")) {
              conn.send('__ACCEPT_VIDEO__');
              startMediaCall(true, true);
            }
          } else if (data === '__ACCEPT_VIDEO__') {
            startMediaCall(false, true);
          } else if (data === '__REQUEST_AUDIO__') {
            if (confirm("Stranger voice call request bhej raha hai. Accept karein?")) {
              conn.send('__ACCEPT_AUDIO__');
              startMediaCall(true, false);
            }
          } else if (data === '__ACCEPT_AUDIO__') {
            startMediaCall(false, false);
          } else {
            logMsg(data, 'stranger');
          }
        } else if (data.type === 'image') {
          const d = document.createElement('div');
          d.className = 'msg stranger';
          d.innerHTML = `<img src="${data.data}" />`;
          chatBox.appendChild(d);
          chatBox.scrollTop = chatBox.scrollHeight;
        } else if (data.type === 'audio_note') {
          const d = document.createElement('div');
          d.className = 'msg stranger';
          d.innerHTML = `<div>Voice message:</div><audio controls src="${data.data}"></audio>`;
          chatBox.appendChild(d);
          chatBox.scrollTop = chatBox.scrollHeight;
        }
      });
      conn.on('close', () => {
        statusEl.innerText = "Stranger disconnected.";
        logMsg("Stranger chala gaya.");
        conn = null;
      });
    }

    function sendText() {
      const input = document.getElementById('msgInput');
      const val = input.value.trim();
      if (!val) return;
      if (!conn) return alert("Pehle 'Match' dabayein.");
      conn.send(val);
      logMsg(val, 'me');
      input.value = '';
    }

    function handleKey(e) {
      if (e.key === 'Enter') sendText();
    }

    function sendPhoto(element) {
      const file = element.files[0];
      if (!file) return;
      if (!conn) return alert("Pehle 'Match' dabayein.");
      const reader = new FileReader();
      reader.onload = (e) => {
        conn.send({ type: 'image', data: e.target.result });
        const d = document.createElement('div');
        d.className = 'msg me';
        d.innerHTML = `<img src="${e.target.result}" />`;
        chatBox.appendChild(d);
        chatBox.scrollTop = chatBox.scrollHeight;
      };
      reader.readAsDataURL(file);
      element.value = '';
    }

    // Voice Note Recording
    async function toggleVoiceRecording() {
      if (!conn) return alert("Pehle 'Match' dabayein.");

      if (!isRecording) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];

          mediaRecorder.ondataavailable = (event) => {
            if (event.data.size > 0) audioChunks.push(event.data);
          };

          mediaRecorder.onstop = () => {
            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
            const reader = new FileReader();
            reader.onload = () => {
              const base64Audio = reader.result;
              conn.send({ type: 'audio_note', data: base64Audio });
              
              const d = document.createElement('div');
              d.className = 'msg me';
              d.innerHTML = `<div>Voice message:</div><audio controls src="${base64Audio}"></audio>`;
              chatBox.appendChild(d);
              chatBox.scrollTop = chatBox.scrollHeight;
            };
            reader.readAsDataURL(audioBlob);
            stream.getTracks().forEach(track => track.stop());
          };

          mediaRecorder.start();
          isRecording = true;
          micBtn.classList.add('recording');
        } catch (err) {
          alert("Mic permission allow karein.");
        }
      } else {
        mediaRecorder.stop();
        isRecording = false;
        micBtn.classList.remove('recording');
      }
    }

    function requestMediaCall(mode) {
      if (!conn) return alert("Pehle chat connect karein.");
      if (mode === 'video') {
        conn.send('__REQUEST_VIDEO__');
        logMsg("Video call request bhej di gayi hai...");
      } else {
        conn.send('__REQUEST_AUDIO__');
        logMsg("Voice call request bhej di gayi hai...");
      }
    }

    function startMediaCall(isCaller, isVideo) {
      const constraints = { audio: true, video: isVideo };
      navigator.mediaDevices.getUserMedia(constraints).then((stream) => {
        localStream = stream;
        if (isVideo) {
          document.getElementById('video-container').style.display = 'block';
          document.getElementById('localVideo').srcObject = stream;
        }

        if (!isCaller) {
          const call = peer.call(conn.peer, stream);
          call.on('stream', (remoteStream) => {
            if (isVideo) {
              document.getElementById('remoteVideo').srcObject = remoteStream;
            } else {
              const audio = new Audio();
              audio.srcObject = remoteStream;
              audio.play();
            }
          });
          currentCall = call;
        }
        logMsg(isVideo ? "Video call active!" : "Voice call active!");
      }).catch(() => alert("Permission allow karein."));
    }

    peer.on('call', (call) => {
      navigator.mediaDevices.getUserMedia({ audio: true, video: true }).then((stream) => {
        call.answer(stream);
        call.on('stream', (remoteStream) => {
          document.getElementById('video-container').style.display = 'block';
          document.getElementById('remoteVideo').srcObject = remoteStream;
        });
      }).catch(() => {
        navigator.mediaDevices.getUserMedia({ audio: true, video: false }).then((stream) => {
          call.answer(stream);
          call.on('stream', (remoteStream) => {
            const audio = new Audio();
            audio.srcObject = remoteStream;
            audio.play();
          });
        });
      });
    });

    async function nextStranger() {
      await cleanupQueue();
      location.reload();
    }

    window.addEventListener('beforeunload', () => {
      cleanupQueue();
    });
  </script>
</body>
</html>
