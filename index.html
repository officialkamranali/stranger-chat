<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Stranger Chat & Call</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
    body { background: #121212; color: #fff; display: flex; flex-direction: column; height: 100vh; }
    header { padding: 12px; background: #1f1f1f; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
    #status { font-size: 13px; color: #aaa; }
    #video-container { display: none; height: 35vh; background: #000; position: relative; }
    video { width: 100%; height: 100%; object-fit: cover; }
    #localVideo { width: 90px; height: 120px; position: absolute; right: 10px; bottom: 10px; border: 2px solid #fff; border-radius: 8px; z-index: 10; }
    #chat-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .msg { padding: 8px 12px; border-radius: 8px; max-width: 75%; font-size: 14px; word-break: break-all; }
    .me { background: #007aff; align-self: flex-end; }
    .stranger { background: #2c2c2e; align-self: flex-start; }
    .system { background: transparent; color: #888; align-self: center; font-size: 12px; }
    .msg img { max-width: 100%; border-radius: 6px; margin-top: 5px; }
    #controls { padding: 10px; background: #1f1f1f; display: flex; gap: 8px; align-items: center; }
    input[type="text"] { flex: 1; padding: 10px; border-radius: 20px; border: 1px solid #333; background: #2c2c2e; color: #fff; outline: none; }
    button { padding: 10px 14px; border: none; border-radius: 20px; background: #007aff; color: #fff; font-weight: bold; cursor: pointer; }
    button.secondary { background: #3a3a3c; }
    #fileInput { display: none; }
  </style>
</head>
<body>

  <header>
    <div>
      <strong>Stranger Chat</strong>
      <div id="status">Connecting to network...</div>
    </div>
    <div>
      <button id="videoBtn" class="secondary" onclick="requestVideoCall()">📹 Video</button>
      <button class="secondary" onclick="location.reload()">Next</button>
    </div>
  </header>

  <div id="video-container">
    <video id="remoteVideo" autoplay playsinline></video>
    <video id="localVideo" autoplay playsinline muted></video>
  </div>

  <div id="chat-box"></div>

  <div id="controls">
    <label for="fileInput" style="cursor:pointer; font-size: 20px;">📷</label>
    <input type="file" id="fileInput" accept="image/*" onchange="sendPhoto(this)">
    <input type="text" id="msgInput" placeholder="Type a message..." onkeypress="handleKey(event)">
    <button onclick="sendText()">Send</button>
  </div>

  <script>
    let peer = new Peer();
    let conn = null;
    let localStream = null;
    let currentCall = null;

    const statusEl = document.getElementById('status');
    const chatBox = document.getElementById('chat-box');

    function logMsg(text, type = 'system') {
      const d = document.createElement('div');
      d.className = `msg ${type}`;
      d.innerText = text;
      chatBox.appendChild(d);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    peer.on('open', (id) => {
      statusEl.innerText = "Online. Your ID: " + id.slice(0, 5);
      logMsg("Aap online hain. Kisi stranger ka ID daal kar connect karein ya apna ID share karein.");
      
      const target = prompt("Agar partner ka ID hai to daalein, warna khali chhod kar Cancel/OK karein:");
      if (target) connectToPeer(target);
    });

    peer.on('connection', (c) => {
      conn = c;
      setupChat();
      statusEl.innerText = "Stranger Connected!";
      logMsg("Stranger jud gaya hai! Privacy enabled: Disconnect hote hi sab delete ho jayega.");
    });

    function connectToPeer(targetId) {
      statusEl.innerText = "Connecting...";
      conn = peer.connect(targetId);
      setupChat();
      conn.on('open', () => {
        statusEl.innerText = "Connected to Stranger!";
        logMsg("Connected!");
      });
    }

    function setupChat() {
      conn.on('data', (data) => {
        if (typeof data === 'string') {
          if (data === '__REQUEST_VIDEO__') {
            if (confirm("Stranger video call request bhej raha hai. Accept karein?")) {
              conn.send('__ACCEPT_VIDEO__');
              startVideo(true);
            }
          } else if (data === '__ACCEPT_VIDEO__') {
            startVideo(false);
          } else {
            logMsg(data, 'stranger');
          }
        } else if (data.type === 'image') {
          const d = document.createElement('div');
          d.className = 'msg stranger';
          d.innerHTML = `<img src="${data.data}" />`;
          chatBox.appendChild(d);
          chatBox.scrollTop = chatBox.scrollHeight;
        }
      });
      conn.on('close', () => {
        statusEl.innerText = "Stranger disconnected.";
        logMsg("Stranger chala gaya.");
      });
    }

    function sendText() {
      const input = document.getElementById('msgInput');
      const val = input.value.trim();
      if (!val || !conn) return;
      conn.send(val);
      logMsg(val, 'me');
      input.value = '';
    }

    function handleKey(e) {
      if (e.key === 'Enter') sendText();
    }

    function sendPhoto(element) {
      const file = element.files[0];
      if (!file || !conn) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        conn.send({ type: 'image', data: e.target.result });
        const d = document.createElement('div');
        d.className = 'msg me';
        d.innerHTML = `<img src="${e.target.result}" />`;
        chatBox.appendChild(d);
        chatBox.scrollTop = chatBox.scrollHeight;
      };
      reader.readAsDataURL(file);
      element.value = '';
    }

    function requestVideoCall() {
      if (!conn) {
        alert("Pehle kisi user se connect hone dein.");
        return;
      }
      conn.send('__REQUEST_VIDEO__');
      logMsg("Video call request bhej di gayi hai...");
    }

    function startVideo(isCaller) {
      navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then((stream) => {
        localStream = stream;
        document.getElementById('video-container').style.display = 'block';
        document.getElementById('localVideo').srcObject = stream;

        if (!isCaller) {
          const call = peer.call(conn.peer, stream);
          call.on('stream', (remoteStream) => {
            document.getElementById('remoteVideo').srcObject = remoteStream;
          });
          currentCall = call;
        }
      }).catch(() => alert("Camera/Mic permission nahi mili."));
    }

    peer.on('call', (call) => {
      navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then((stream) => {
        localStream = stream;
        document.getElementById('video-container').style.display = 'block';
        document.getElementById('localVideo').srcObject = stream;
        call.answer(stream);
        call.on('stream', (remoteStream) => {
          document.getElementById('remoteVideo').srcObject = remoteStream;
        });
        currentCall = call;
      });
    });
  </script>
</body>
</html>
