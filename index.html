<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Stranger Chat Pro</title>
  <script src="https://unpkg.com/mqtt@4.3.7/dist/mqtt.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    
    html, body {
      height: 100%;
      height: 100dvh;
      width: 100%;
      background: #0b0b10;
      color: #fff;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      -webkit-user-select: none;
      user-select: none;
    }

    /* Header */
    header {
      flex-shrink: 0;
      background: #14141c;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #22222e;
      z-index: 20;
    }
    .status-wrap { display: flex; align-items: center; gap: 8px; }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #ff9500; transition: 0.3s; }
    .status-dot.online { background: #00e676; }
    .status-text { font-size: 13px; color: #ccc; font-weight: 500; }
    
    .call-actions { display: flex; gap: 8px; align-items: center; }
    .action-btn { background: #22222e; border: 1px solid #333342; color: #fff; padding: 6px 10px; border-radius: 8px; font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 4px; }
    .action-btn.danger { background: #ff3b30; border: none; font-weight: bold; }
    .action-btn:active { opacity: 0.7; }

    /* Chat Area */
    #chat-box {
      flex: 1;
      padding: 14px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    
    .msg { max-width: 82%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.4; word-break: break-word; }
    .msg.me { align-self: flex-end; background: #007aff; color: #fff; border-bottom-right-radius: 2px; }
    .msg.stranger { align-self: flex-start; background: #1e1e28; color: #eee; border-bottom-left-radius: 2px; }
    .system-msg { align-self: center; font-size: 12px; color: #888; background: #161622; padding: 4px 12px; border-radius: 20px; text-align: center; }

    /* Media Button */
    .secure-media-btn {
      background: #191924;
      border: 1px dashed #ff9500;
      color: #ff9500;
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: bold;
      font-size: 13px;
    }

    /* Bottom Input Bar */
    .input-bar {
      flex-shrink: 0;
      background: #14141c;
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px));
      display: flex;
      align-items: center;
      gap: 8px;
      border-top: 1px solid #22222e;
      z-index: 20;
    }
    .icon-btn { background: none; border: none; font-size: 20px; cursor: pointer; padding: 6px; line-height: 1; color: #fff; }
    .icon-btn.recording { color: #ff3b30; animation: pulse 1s infinite; }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }

    #text-input { flex: 1; background: #1f1f2a; border: 1px solid #333342; color: #fff; padding: 10px 14px; border-radius: 20px; outline: none; font-size: 14px; }
    .send-btn { background: #007aff; border: none; color: #fff; padding: 10px 16px; border-radius: 20px; font-weight: bold; font-size: 13px; cursor: pointer; }

    /* Disappearing Modal */
    #media-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 1000; align-items: center; justify-content: center; }
    .modal-card { background: #181824; padding: 20px; border-radius: 14px; width: 85%; max-width: 320px; text-align: center; border: 1px solid #2c2c3e; }
    .timer-wrap { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin: 12px 0; }
    .timer-btn { background: #252536; color: #ccc; border: 1px solid #3e3e52; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }
    .timer-btn.selected { background: #ff9500; border-color: #ff9500; color: #000; font-weight: bold; }

    /* Fullscreen Secure Viewer */
    #media-viewer { display: none; position: fixed; inset: 0; background: #000; z-index: 9999; flex-direction: column; align-items: center; justify-content: center; }
    #media-viewer img, #media-viewer video { max-width: 95%; max-height: 80vh; border-radius: 6px; pointer-events: none; }
    .viewer-top { position: absolute; top: 15px; width: 100%; display: flex; justify-content: space-between; padding: 0 20px; color: #fff; font-size: 14px; font-weight: bold; }
    .watermark-overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; opacity: 0.12; font-size: 24px; font-weight: bold; color: #fff; transform: rotate(-30deg); }

    /* Calling Overlay & Permission Modal */
    #call-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 10000; align-items: center; justify-content: center; flex-direction: column; }
    .call-card { background: #1c1c28; padding: 25px; border-radius: 16px; width: 85%; max-width: 300px; text-align: center; border: 1px solid #333344; }
    .call-btn-group { display: flex; justify-content: center; gap: 15px; margin-top: 20px; }
    .call-btn { padding: 12px 24px; border-radius: 30px; border: none; font-weight: bold; font-size: 14px; cursor: pointer; }
    .call-btn.accept { background: #00e676; color: #000; }
    .call-btn.decline { background: #ff3b30; color: #fff; }

    /* In-Call Video Container */
    #call-container { display: none; position: fixed; inset: 0; background: #111; z-index: 10001; flex-direction: column; }
    .video-view { flex: 1; position: relative; background: #000; display: flex; align-items: center; justify-content: center; }
    video.remote { width: 100%; height: 100%; object-fit: cover; }
    video.local { position: absolute; top: 15px; right: 15px; width: 90px; height: 130px; object-fit: cover; border-radius: 10px; border: 2px solid #007aff; }
    .call-controls { height: 80px; background: #14141c; display: flex; align-items: center; justify-content: center; gap: 20px; }
    .end-call-btn { background: #ff3b30; color: #fff; border: none; border-radius: 50%; width: 55px; height: 55px; font-size: 20px; cursor: pointer; }
  </style>
</head>
<body oncontextmenu="return false;">

  <header>
    <div class="status-wrap">
      <span class="status-dot" id="status-dot"></span>
      <span class="status-text" id="partner-status">Connecting...</span>
    </div>
    <div class="call-actions">
      <button class="action-btn" onclick="startCall('voice')">📞</button>
      <button class="action-btn" onclick="startCall('video')">📹</button>
      <button class="action-btn danger" onclick="findNewStranger()">Next</button>
    </div>
  </header>

  <div id="chat-box">
    <div class="system-msg">🔒 Searching for real stranger...</div>
  </div>

  <!-- Pinned Bottom Bar -->
  <div class="input-bar">
    <button class="icon-btn" onclick="openMediaSelector()" type="button">📷</button>
    <input type="file" id="media-file-input" accept="image/*,video/*" style="display:none;" onchange="handleFileChosen(event)">
    <button class="icon-btn" id="voice-record-btn" onclick="toggleVoiceRecording()" type="button">🎙️</button>
    <input type="text" id="text-input" placeholder="Type a message..." onkeypress="handleEnter(event)">
    <button class="send-btn" onclick="sendTextMessage()" type="button">Send</button>
  </div>

  <!-- Disappearing Modal -->
  <div id="media-modal">
    <div class="modal-card">
      <h3 style="font-size: 15px;">⏱️ Media Self-Destruct</h3>
      <p style="font-size: 12px; color: #aaa; margin-top: 4px;">Time pura hote hi media chat se delete ho jayega.</p>
      <div class="timer-wrap">
        <button class="timer-btn selected" onclick="selectTimer('once', this)">1-View</button>
        <button class="timer-btn" onclick="selectTimer('3', this)">3s</button>
        <button class="timer-btn" onclick="selectTimer('5', this)">5s</button>
        <button class="timer-btn" onclick="selectTimer('10', this)">10s</button>
        <button class="timer-btn" onclick="selectTimer('15', this)">15s</button>
      </div>
      <button class="send-btn" style="width: 100%; margin-top: 10px;" onclick="confirmSendMedia()">Send Secure Media</button>
    </div>
  </div>

  <!-- Fullscreen Secure Viewer -->
  <div id="media-viewer">
    <div class="viewer-top">
      <span id="countdown-tag">⏱️ Viewing</span>
      <span onclick="closeMediaViewer()" style="cursor:pointer; font-size: 20px;">✕</span>
    </div>
    <div class="watermark-overlay">PROTECTED • DISAPPEARING</div>
    <div id="viewer-media-slot"></div>
  </div>

  <!-- Incoming Call Permission Modal -->
  <div id="call-modal">
    <div class="call-card">
      <h3 id="incoming-call-text">📞 Incoming Call...</h3>
      <p style="font-size: 12px; color: #888; margin-top: 6px;">Stranger aapse baat karna chahta hai.</p>
      <div class="call-btn-group">
        <button class="call-btn accept" onclick="acceptCall()">Accept</button>
        <button class="call-btn decline" onclick="declineCall()">Decline</button>
      </div>
    </div>
  </div>

  <!-- Active Call Interface -->
  <div id="call-container">
    <div class="video-view">
      <video id="remoteVideo" class="remote" autoplay playsinline></video>
      <video id="localVideo" class="local" autoplay playsinline muted></video>
      <audio id="remoteAudio" autoplay></audio>
    </div>
    <div class="call-controls">
      <button class="end-call-btn" onclick="endCall(true)">📞</button>
    </div>
  </div>

  <script>
    // Live Network & Broker Setup
    const myId = "usr_" + Math.random().toString(36).substring(2, 9);
    const LOBBY_TOPIC = "stranger_live_lobby_v9";
    const PRIVATE_TOPIC = "stranger_priv_" + myId;
    
    let client = mqtt.connect("wss://broker.hivemq.com:8884/mqtt");
    let currentRoom = null;
    let isMatched = false;
    let searchInterval = null;

    client.on("connect", () => {
      client.subscribe(PRIVATE_TOPIC);
      findNewStranger();
    });

    client.on("message", (topic, msg) => {
      try {
        const data = JSON.parse(msg.toString());

        if (topic === LOBBY_TOPIC && !isMatched) {
          if (data.type === "looking" && data.peerId !== myId) {
            if (myId < data.peerId) {
              const roomId = "room_" + myId + "_" + data.peerId;
              client.publish("stranger_priv_" + data.peerId, JSON.stringify({
                type: "match_invite",
                roomId: roomId
              }));
              joinRoom(roomId);
            }
          }
        } else if (topic === PRIVATE_TOPIC && !isMatched) {
          if (data.type === "match_invite") {
            joinRoom(data.roomId);
          }
        } else if (currentRoom && topic === currentRoom) {
          if (data.senderId === myId) return;

          if (data.type === "chat") {
            appendMessage(data.text, 'stranger');
          } else if (data.type === "media") {
            appendSecureMediaButton(data.mediaId, data.mediaObj, data.timerType, 'stranger');
          } else if (data.type === "voice_note") {
            appendVoiceNote(data.audioUrl, 'stranger');
          } else if (data.type === "call_req") {
            handleIncomingCall(data.callType);
          } else if (data.type === "call_ans") {
            handleCallAnswer(data.accepted);
          } else if (data.type === "webrtc_signal") {
            handleWebRTCSignal(data.signal);
          } else if (data.type === "call_ended") {
            endCall(false);
          } else if (data.type === "leave") {
            handlePartnerLeft();
          }
        }
      } catch (e) {}
    });

    function findNewStranger() {
      endCall(false);
      if (currentRoom) {
        client.publish(currentRoom, JSON.stringify({ type: "leave", senderId: myId }));
        client.unsubscribe(currentRoom);
      }
      currentRoom = null;
      isMatched = false;
      if (searchInterval) clearInterval(searchInterval);

      document.getElementById('partner-status').innerText = "Finding stranger...";
      document.getElementById('status-dot').className = "status-dot";
      
      const box = document.getElementById('chat-box');
      box.innerHTML = `<div class="system-msg">🔍 Searching for an online stranger...</div>`;

      client.subscribe(LOBBY_TOPIC);
      searchInterval = setInterval(() => {
        if (!isMatched) {
          client.publish(LOBBY_TOPIC, JSON.stringify({ type: "looking", peerId: myId }));
        }
      }, 1500);
    }

    function joinRoom(roomId) {
      isMatched = true;
      if (searchInterval) clearInterval(searchInterval);
      client.unsubscribe(LOBBY_TOPIC);

      currentRoom = roomId;
      client.subscribe(currentRoom);

      document.getElementById('partner-status').innerText = "Stranger Connected";
      document.getElementById('status-dot').className = "status-dot online";

      const box = document.getElementById('chat-box');
      box.innerHTML = `<div class="system-msg">🎉 Stranger connected! Start talking.</div>`;
    }

    function handlePartnerLeft() {
      appendSystemMessage("Stranger disconnected.");
      document.getElementById('partner-status').innerText = "Disconnected";
      document.getElementById('status-dot').className = "status-dot";
      isMatched = false;
      endCall(false);
      setTimeout(findNewStranger, 2000);
    }

    function appendSystemMessage(txt) {
      const box = document.getElementById('chat-box');
      const div = document.createElement('div');
      div.className = "system-msg";
      div.innerText = txt;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    // Text Chat
    function handleEnter(e) { if (e.key === "Enter") sendTextMessage(); }

    function sendTextMessage() {
      const input = document.getElementById('text-input');
      const text = input.value.trim();
      if (!text || !isMatched || !currentRoom) return;

      appendMessage(text, 'me');
      client.publish(currentRoom, JSON.stringify({ type: "chat", text: text, senderId: myId }));
      input.value = "";
    }

    function appendMessage(text, sender) {
      const box = document.getElementById('chat-box');
      const div = document.createElement('div');
      div.className = `msg ${sender}`;
      div.innerText = text;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    // Disappearing Media
    let selectedTimerValue = "once";
    let pendingMediaData = null;
    let activeMediaTimeout = null;

    function openMediaSelector() {
      if (!isMatched || !currentRoom) return alert("Pehle kisi stranger se connect hone dein!");
      document.getElementById('media-file-input').click();
    }

    function handleFileChosen(e) {
      const file = e.target.files[0];
      if (!file) return;

      if (file.type.startsWith('video') && file.size > 2 * 1024 * 1024) {
        return alert("Video 2MB se chhoti honi chahiye.");
      }

      const reader = new FileReader();
      if (file.type.startsWith('image')) {
        reader.onload = function(evt) {
          const img = new Image();
          img.onload = function() {
            const canvas = document.createElement('canvas');
            const max = 700;
            let w = img.width, h = img.height;
            if (w > h && w > max) { h = Math.round(h * max / w); w = max; }
            else if (h > max) { h = Math.round(h * max / h); h = max; }
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            pendingMediaData = { type: 'image', dataUrl: canvas.toDataURL('image/jpeg', 0.6) };
            document.getElementById('media-modal').style.display = 'flex';
          };
          img.src = evt.target.result;
        };
      } else {
        reader.onload = function(evt) {
          pendingMediaData = { type: 'video', dataUrl: evt.target.result };
          document.getElementById('media-modal').style.display = 'flex';
        };
      }
      reader.readAsDataURL(file);
      e.target.value = "";
    }

    function selectTimer(val, btn) {
      document.querySelectorAll('.timer-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedTimerValue = val;
    }

    function confirmSendMedia() {
      document.getElementById('media-modal').style.display = 'none';
      if (!pendingMediaData || !currentRoom) return;

      const mediaId = "media_" + Date.now();
      appendSecureMediaButton(mediaId, pendingMediaData, selectedTimerValue, 'me');

      client.publish(currentRoom, JSON.stringify({
        type: "media",
        mediaId: mediaId,
        mediaObj: pendingMediaData,
        timerType: selectedTimerValue,
        senderId: myId
      }));

      pendingMediaData = null;
    }

    function appendSecureMediaButton(id, mediaObj, timerType, sender) {
      const box = document.getElementById('chat-box');
      const div = document.createElement('div');
      div.className = `msg ${sender}`;
      div.id = id;

      const btn = document.createElement('button');
      btn.className = "secure-media-btn";
      btn.innerHTML = `🔒 View ${mediaObj.type.toUpperCase()} (${timerType === 'once' ? '1-View' : timerType + 's'})`;
      btn.onclick = () => openSecureViewer(id, mediaObj, timerType);

      div.appendChild(btn);
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    function openSecureViewer(msgId, mediaObj, timerType) {
      const viewer = document.getElementById('media-viewer');
      const slot = document.getElementById('viewer-media-slot');
      const tag = document.getElementById('countdown-tag');
      slot.innerHTML = "";

      let el = mediaObj.type === 'video' ? document.createElement('video') : document.createElement('img');
      el.src = mediaObj.dataUrl;
      if (mediaObj.type === 'video') { el.autoplay = true; el.playsInline = true; }
      slot.appendChild(el);
      viewer.style.display = 'flex';

      if (timerType !== 'once') {
        let left = parseInt(timerType);
        tag.innerText = `⏱️ Burning in ${left}s`;
        activeMediaTimeout = setInterval(() => {
          left--;
          tag.innerText = `⏱️ Burning in ${left}s`;
          if (left <= 0) {
            clearInterval(activeMediaTimeout);
            destroyMedia(msgId);
          }
        }, 1000);
      } else {
        tag.innerText = "👁️ View Once";
      }

      viewer.dataset.activeMsgId = msgId;
    }

    function closeMediaViewer() {
      const viewer = document.getElementById('media-viewer');
      if (activeMediaTimeout) clearInterval(activeMediaTimeout);
      const activeId = viewer.dataset.activeMsgId;
      if (activeId) destroyMedia(activeId);
      viewer.style.display = 'none';
      document.getElementById('viewer-media-slot').innerHTML = "";
    }

    function destroyMedia(msgId) {
      const elem = document.getElementById(msgId);
      if (elem) {
        elem.innerHTML = "<i>💥 Media Expired & Destroyed</i>";
        elem.style.opacity = "0.4";
      }
      const viewer = document.getElementById('media-viewer');
      viewer.style.display = 'none';
      document.getElementById('viewer-media-slot').innerHTML = "";
    }

    // Anti-screenshot & Visibility Defense
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        const viewer = document.getElementById('media-viewer');
        if (viewer.style.display === 'flex') closeMediaViewer();
      }
    });

    // Voice Message Recorder
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;

    async function toggleVoiceRecording() {
      if (!isMatched || !currentRoom) return alert("Stranger se connect hone dein!");
      const btn = document.getElementById('voice-record-btn');

      if (!isRecording) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];

          mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
          mediaRecorder.onstop = () => {
            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
            const reader = new FileReader();
            reader.onloadend = () => {
              const base64Audio = reader.result;
              appendVoiceNote(base64Audio, 'me');
              client.publish(currentRoom, JSON.stringify({ type: "voice_note", audioUrl: base64Audio, senderId: myId }));
            };
            reader.readAsDataURL(audioBlob);
            stream.getTracks().forEach(track => track.stop());
          };

          mediaRecorder.start();
          isRecording = true;
          btn.classList.add('recording');
        } catch (err) {
          alert("Microphone permission ki zaroorat hai.");
        }
      } else {
        mediaRecorder.stop();
        isRecording = false;
        btn.classList.remove('recording');
      }
    }

    function appendVoiceNote(url, sender) {
      const box = document.getElementById('chat-box');
      const div = document.createElement('div');
      div.className = `msg ${sender}`;
      div.innerHTML = `🎵 <b>Voice Message:</b><br><audio controls src="${url}" style="max-width:210px; height:32px; margin-top:5px;"></audio>`;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    // WebRTC Audio & Video Calling Engine
    let peerConn = null;
    let localStream = null;
    let requestedCallType = null;

    const rtcConfig = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };

    function startCall(type) {
      if (!isMatched || !currentRoom) return alert("Pehle stranger se connect hone dein!");
      requestedCallType = type;
      appendSystemMessage(`Calling stranger (${type})...`);
      client.publish(currentRoom, JSON.stringify({ type: "call_req", callType: type, senderId: myId }));
    }

    function handleIncomingCall(type) {
      requestedCallType = type;
      document.getElementById('incoming-call-text').innerText = type === 'video' ? "📹 Video Call Request" : "📞 Voice Call Request";
      document.getElementById('call-modal').style.display = 'flex';
    }

    function declineCall() {
      document.getElementById('call-modal').style.display = 'none';
      client.publish(currentRoom, JSON.stringify({ type: "call_ans", accepted: false, senderId: myId }));
    }

    async function acceptCall() {
      document.getElementById('call-modal').style.display = 'none';
      client.publish(currentRoom, JSON.stringify({ type: "call_ans", accepted: true, senderId: myId }));
      initiateWebRTC(false, requestedCallType);
    }

    function handleCallAnswer(accepted) {
      if (!accepted) {
        appendSystemMessage("Stranger ne call decline kar di.");
      } else {
        appendSystemMessage("Call accept ho gayi!");
        initiateWebRTC(true, requestedCallType);
      }
    }

    async function initiateWebRTC(isInitiator, type) {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          video: type === 'video',
          audio: true
        });

        document.getElementById('call-container').style.display = 'flex';
        const localVid = document.getElementById('localVideo');
        if (type === 'video') {
          localVid.srcObject = localStream;
          localVid.style.display = "block";
        } else {
          localVid.style.display = "none";
        }

        peerConn = new RTCPeerConnection(rtcConfig);
        localStream.getTracks().forEach(track => peerConn.addTrack(track, localStream));

        peerConn.ontrack = e => {
          if (type === 'video') {
            document.getElementById('remoteVideo').srcObject = e.streams[0];
          } else {
            document.getElementById('remoteAudio').srcObject = e.streams[0];
          }
        };

        peerConn.onicecandidate = e => {
          if (e.candidate) {
            client.publish(currentRoom, JSON.stringify({
              type: "webrtc_signal",
              signal: { candidate: e.candidate },
              senderId: myId
            }));
          }
        };

        if (isInitiator) {
          const offer = await peerConn.createOffer();
          await peerConn.setLocalDescription(offer);
          client.publish(currentRoom, JSON.stringify({
            type: "webrtc_signal",
            signal: { sdp: peerConn.localDescription },
            senderId: myId
          }));
        }
      } catch (err) {
        alert("Camera/Mic permission nahi mili.");
        endCall(true);
      }
    }

    async function handleWebRTCSignal(signal) {
      if (!peerConn) return;
      if (signal.sdp) {
        await peerConn.setRemoteDescription(new RTCSessionDescription(signal.sdp));
        if (signal.sdp.type === "offer") {
          const answer = await peerConn.createAnswer();
          await peerConn.setLocalDescription(answer);
          client.publish(currentRoom, JSON.stringify({
            type: "webrtc_signal",
            signal: { sdp: peerConn.localDescription },
            senderId: myId
          }));
        }
      } else if (signal.candidate) {
        try {
          await peerConn.addIceCandidate(new RTCIceCandidate(signal.candidate));
        } catch (e) {}
      }
    }

    function endCall(sendSignal) {
      if (sendSignal && currentRoom) {
        client.publish(currentRoom, JSON.stringify({ type: "call_ended", senderId: myId }));
      }
      if (peerConn) { peerConn.close(); peerConn = null; }
      if (localStream) { localStream.getTracks().forEach(track => track.stop()); localStream = null; }
      document.getElementById('call-container').style.display = 'none';
      document.getElementById('call-modal').style.display = 'none';
    }
  </script>
</body>
